name: Windows installer validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - "src/Atlas.Edge.Runtime/**"
      - "tests/Atlas.Edge.Tests/InstallerFoundationTests.cs"
      - ".github/workflows/windows-installer.yml"

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick --no-progress -y
      - name: Validate repository
        shell: pwsh
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build
          dotnet format --verify-no-changes --no-restore
      - name: Build unsigned installer
        shell: pwsh
        run: ./installer/scripts/build-installer.ps1 -Configuration Release -BuildNumber $env:GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-edge-windows-installer-unsigned
          path: artifacts/installer/*/
          if-no-files-found: error
